<script>
"use strict";
/* =========================================================

   ========================================================= */
const W=360,H=720,OL='#4a3226';
const WW=1700,WH=2200;
const cv=document.getElementById('c');const cx=cv.getContext('2d');
let DPRMAX=2,g=cx,SC=1,DPR=1,ISC=1,IOX=0,IOY=0,U=1,VW=360,VH=720,BG=null,T=0;
let camX=360,camY=500,camLock=true;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,DPRMAX);
  const iw=innerWidth,ih=innerHeight;
  SC=Math.min(iw/420,ih/640);ISC=Math.min(iw/W,ih/H);IOX=(iw-W*ISC)/2;IOY=(ih-H*ISC)/2;
  U=Math.min(iw/360,1.6);VW=iw/U;VH=ih/U;
  cv.width=Math.round(iw*DPR);cv.height=Math.round(ih*DPR);
  cv.style.width=iw+'px';cv.style.height=ih+'px';BG=null;
}
addEventListener('resize',resize);resize();

/* ====================== SES ====================== */
let AC=null,master,musicBus,sfxBus,NB,sndMode=0; // 0 hepsi,1 müzik kapalı,2 sessiz
const CENTS=[0,113,385,498,702,906,996];
function hz(d,b){const o=Math.floor(d/7),i=((d%7)+7)%7;return b*Math.pow(2,(CENTS[i]+1200*o)/1200);}
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=0.8;
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;
  master.connect(comp);comp.connect(AC.destination);
  musicBus=AC.createGain();musicBus.gain.value=0;musicBus.connect(master);
  sfxBus=AC.createGain();sfxBus.gain.value=0.9;sfxBus.connect(master);
  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  setInterval(sched,25);
}
function env(gn,t,a,p,dc){gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(Math.max(p,0.0002),t+a);gn.gain.exponentialRampToValueAtTime(0.0001,t+a+dc);}
function osc(type,f,t,a,p,dc,dest,fEnd){const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(fEnd)o.frequency.exponentialRampToValueAtTime(fEnd,t+a+dc);env(gn,t,a,p,dc);o.connect(gn);gn.connect(dest);o.start(t);o.stop(t+a+dc+0.05);}
function nz(t,dur,p,ft,fr,q,dest,fEnd){const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const f=AC.createBiquadFilter();f.type=ft;f.frequency.setValueAtTime(fr,t);if(fEnd)f.frequency.exponentialRampToValueAtTime(fEnd,t+dur);f.Q.value=q||1;const gn=AC.createGain();env(gn,t,0.004,p,dur);s.connect(f);f.connect(gn);gn.connect(dest);s.start(t,Math.random()*0.5);s.stop(t+dur+0.05);}
const SFX={
  clang(t,d){const f=640+Math.random()*160;[[1,.45,.9],[2.76,.22,.55],[5.4,.12,.32],[8.93,.07,.2]].forEach(([r,p,dc])=>osc('sine',f*r,t,.002,p,dc,d));nz(t,.05,.5,'bandpass',4200,1.2,d);osc('sine',150,t,.002,.55,.13,d,55);},
  whoosh(t,d){nz(t,.55,.28,'lowpass',260,.7,d,1500);},
  fire(t,d){nz(t,.35,.12,'lowpass',500,.6,d,900);for(let i=0;i<4;i++)nz(t+Math.random()*.3,.018,.14,'highpass',3200,1,d);},
  hiss(t,d){nz(t,1.1,.32,'highpass',5200,.8,d,1600);for(let i=0;i<6;i++)osc('sine',260+Math.random()*420,t+.12+i*.1,.005,.07,.06,d,900);},
  thump(t,d){osc('sine',115,t,.003,.7,.16,d,52);nz(t,.1,.32,'lowpass',650,1,d);nz(t+.01,.05,.08,'bandpass',2200,2,d);},
  snip(t,d){nz(t,.03,.32,'highpass',5000,2,d);nz(t+.08,.03,.3,'highpass',6200,2,d);osc('triangle',2400,t+.08,.002,.05,.05,d);},
  scratch(t,d){nz(t,.075,.2,'bandpass',2400+Math.random()*2200,3.5,d);},
  stamp(t,d){osc('sine',95,t,.002,.6,.13,d,48);osc('triangle',430,t,.002,.25,.06,d);nz(t,.045,.3,'lowpass',1500,1,d);},
  pop(t,d){osc('sine',380,t,.003,.32,.08,d,950);},
  drop(t,d){osc('sine',760,t,.003,.28,.09,d,300);},
  register(t,d){osc('triangle',hz(14,440),t,.002,.22,.35,d);osc('triangle',hz(18,440),t+.06,.002,.2,.45,d);nz(t,.06,.18,'bandpass',3200,2,d);osc('sine',hz(21,440),t+.12,.002,.12,.5,d);},
  coin(t,d){osc('square',hz(11,440),t,.002,.08,.07,d);osc('square',hz(14,440),t+.06,.002,.08,.16,d);},
  unlock(t,d){[0,2,4,7,9,11,14].forEach((k,i)=>{osc('square',hz(k,440),t+i*.07,.004,.09,.16,d);osc('sine',hz(k+7,440),t+i*.07,.004,.08,.22,d);});for(let i=0;i<8;i++)osc('sine',2200+Math.random()*2200,t+.5+i*.05,.002,.05,.16,d);},
  tick(t,d){osc('sine',1150,t,.002,.07,.03,d);},
  happy(t,d){osc('sine',hz(7,440),t,.004,.11,.08,d,hz(9,440));osc('sine',hz(9,440),t+.09,.004,.1,.1,d,hz(11,440));},
  angry(t,d){osc('sawtooth',170,t,.01,.1,.42,d,100);osc('square',120,t+.05,.01,.05,.3,d,80);},
  sob(t,d){osc('sine',560,t,.02,.12,.32,d,320);osc('sine',500,t+.28,.02,.11,.42,d,270);},

function drawGuy(x,y,o,sp){
  g.save();g.translate(x,y);
  shadow(0,0,sp.bw*.62,3.6);
  const mv=o.moving,ph=(o.walk||0)*13,bob=mv?Math.abs(Math.sin(ph))*2.4:Math.sin(T*2.4+(o.seed||0))*.6;
  if(o.dir<0)g.scale(-1,1);
  const k=sp.k||1;g.scale(k,k);
  const bw=sp.bw,bh=sp.bh,R=sp.R,legH=sp.leg||8;
  const sw=mv?Math.sin(ph)*3.2:0;
  if(sp.tail){g.save();g.translate(-bw*.4,-legH-bh*.25-bob);g.rotate(Math.sin(T*3+(o.seed||0))*.25);g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(-14,-2,-16,-14);S(5.5);g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(-14,-2,-16,-14);S(3.2,sp.tail);g.restore();}
  [-1,1].forEach((s,i)=>{rr(s*bw*.22-3+(i?sw:-sw)*.5,-legH-1,6,legH+1,2.5);F(sp.leg2||shade(sp.cloth,-.35));S(1.8);});
  const by=-legH-bh-bob;
  if(sp.wing){[-1,1].forEach(s=>{el(s*bw*.5,by+bh*.45,4.5,bh*.42,s*(.25+(mv?Math.sin(ph)*.15:0)));F(sp.wing);S(1.8);});}
  rr(-bw/2,by,bw,bh,Math.min(8,bw*.4));F(sp.cloth);S(2.2);
  if(sp.apron){rr(-bw*.32,by+bh*.28,bw*.64,bh*.68,4);F(sp.apron);S(1.6);g.beginPath();g.moveTo(-bw*.2,by+bh*.55);g.lineTo(bw*.2,by+bh*.55);S(1.1,shade(sp.apron,-.25));}
  if(sp.belt){rr(-bw/2+1,by+bh*.55,bw-2,3.5,1.5);F(sp.belt);S(1.3);}
  if(sp.trim){g.beginPath();g.moveTo(0,by+2);g.lineTo(0,by+bh-1);S(1.6,sp.trim);}
  let handY=by+bh*.5;
  if(!sp.wing){
    if(o.carry){[-1,1].forEach(s=>{circ(s*bw*.45,by+3,3.6);F(sp.skin2||o.skin);S(1.7);});}
    else if(o.tool){/* alet eli aşağıda çizilir */circ(-bw*.52,handY+(mv?-sw*.5:0),3.6);F(sp.skin2||o.skin);S(1.7);}
    else [-1,1].forEach(s=>{circ(s*bw*.55,handY+(mv?s*sw*.6:0),3.6);F(sp.skin2||o.skin);S(1.7);});
  }
  const hy=by-R*.78;
  g.save();g.translate(0,hy);HEADS[sp.head](R,o);g.restore();
  if(o.tool&&!sp.wing)drawTool(o.tool,bw*.5,handY,o.toolA||0,sp.skin2||o.skin);
  g.restore();
  return y-(legH+bh+R*1.75+bob)*k;
}
function drawTool(tool,x,y,a,skin){
  g.save();g.translate(x,y);g.rotate(a);
  if(tool==='hammer'){rr(-1.6,-16,3.2,17,1.5);F('#8a5a32');S(1.6);rr(-6,-21,12,7,2);F('#6d7484');S(1.8);rr(-6,-21,12,2.5,1.2);F('#a4abb9');}

  else if(tool==='quill'){g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(-3,-10,2,-20);g.quadraticCurveTo(5,-10,0,0);F('#fbf6ee');S(1.4);g.beginPath();g.moveTo(0,0);g.lineTo(1,-17);S(.9,'#b8a888');}
  circ(0,0,3.6);F(skin);S(1.7);
  g.restore();
}

  if(S0.combo){if(!o.rec)return false;if(id!==S0.combo&&id!==o.rec)return false;const nc=o.inp.filter(x=>x===S0.combo).length,nb=o.inp.length-nc;const half=Math.ceil(inCap(o.type)/2);if(id===S0.combo?nc>=half:nb>=half)return false;}

function stOutN(o){return o.out.length+o.fin.length;}
function ocakNear(o,r){return objs('st',q=>q.type==='ocak'&&Math.hypot(q.x-o.x,q.y-o.y)<(r||190));}
function canCraft(o){const S0=ST[o.type];if(S0.auto||stOutN(o)>=outCap(o.type))return false;
  if(S0.combo){return o.inp.indexOf(S0.combo)>=0&&o.inp.indexOf(o.rec)>=0&&!!comboOut(o);}
  if(o.inp.length)return true;
  if(o.type==='ors'){for(const oc of ocakNear(o)){const i=oc.out.indexOf('kizgin');if(i>=0){oc.out.splice(i,1);o.inp.push('kizgin');return true;}}}
  return false;}
function craftStep(o,who){const S0=ST[o.type];if(!canCraft(o))return;
  o.craft++;const wx=o.x,wy=o.y;
  if(S0.tool==='hammer'){sfxAt('clang',wx,wy,.9);sparks(wx-6,wy-30,10);if(who===G.p)shake=Math.max(shake,1.6);}
  else if(S0.tool==='mallet'){sfxAt('thump',wx,wy);puff('fluff',wx-6,wy-30,3,30);if(who===G.p)shake=Math.max(shake,1);}

  if(o.craft>=S0.strikes){o.craft=0;let out;
    if(S0.combo){o.inp.splice(o.inp.indexOf(S0.combo),1);o.inp.splice(o.inp.indexOf(o.rec),1);out=comboOut(o);achieve('efsun');sfx('sparkle',.8);}
    else{o.inp.shift();out=S0.out;}
    o.fin.push({id:out,t:S0.finish});if(who===G.p)G.tut.forged=true;
    if(who!==G.p&&G.skill.usta.titiz&&Math.random()<.15*G.skill.usta.titiz/3*3&&stOutN(o)<outCap(o.type)){o.fin.push({id:out,t:S0.finish+.4});}}}

      if(o.type==='ocak'&&Math.random()<dt*2)fx('ember',o.x+(Math.random()-.5)*16,o.y-24,{vy:-30,vx:(Math.random()-.5)*10,t:.7});
      if(o.type==='imbik'&&Math.random()<dt*3)fx('bubble',o.x-4+(Math.random()-.5)*20,o.y-40,{vy:-20,t:.8});
      if(o.heat>=S0.t*evC()){o.heat=0;o.inp.shift();o.out.push(S0.out);sfxAt(o.type==='ocak'?'fire':'pop',o.x,o.y,.45);}}
    else o.heat=0;}
  for(let i=o.fin.length-1;i>=0;i--){o.fin[i].t-=dt;if(o.fin[i].t<=0){const id=o.fin[i].id;o.fin.splice(i,1);o.out.push(id);
    if(o.type==='ors'){sfxAt('hiss',o.x,o.y,.8);puff('steam',o.x+30,o.y-26,6,14);}else if(o.type==='kece'||o.type==='deri')sfxAt('snip',o.x,o.y);else{sfxAt('stamp',o.x,o.y);}}}}

/* ====================== HAMAL GÖREVLERİ ====================== */
function fillK(r){return rackN(r)/rackCap(r);}
function bestDest(id,from){
  if(id==='kizgin'){let best=null,bd=1e9;for(const o of objs('st',q=>q.type==='ors'&&stAccepts(q,'kizgin'))){if(ocakNear(o).some(q=>q.out.length||q.inp.length))continue;const d=Math.hypot(o.x-from.x,o.y-from.y);if(d<bd){bd=d;best=o;}}return best;}
  const racks=objs('rack',r=>rackAccepts(r,id)&&rackN(r)<rackCap(r));racks.sort((a,b)=>fillK(a)-fillK(b));
  const C=G.contract;if(C&&C.item===id&&C.got<C.need){const t=findObj('teslim');if(t&&(!racks.length||fillK(racks[0])>=.4||G.day>=C.due))return t;}
  const ef=objs('st',q=>ST[q.type].combo&&stAccepts(q,id)).sort((a,b)=>a.inp.length-b.inp.length);
  if(ef.length&&(!racks.length||fillK(racks[0])>=.5))return ef[0];
  return racks[0]||depoFor(id);}
function taskKind(t){if(t.src.k==='sup')return 'ham';if((t.dst.k==='st'&&ST[t.dst.type].combo)||(t.src.k==='st'&&ST[t.src.type].combo))return 'kombo';if(t.dst.k==='depo'||t.src.k==='depo'||t.dst.k==='teslim')return 'depo';return 'raf';}
function stVal(o){const S0=ST[o.type];const out=S0.combo?comboOut(o):S0.out==='kizgin'?'yatagan':S0.out;return out&&IT[out]?price(out):10;}
function demandMap(){if(G._demT>G.t)return G._dem;G._demT=G.t+.8;const D={};const add=(id,v)=>{if(id)D[id]=(D[id]||0)+v;};
  for(const c of G.cust){if(c.pass||!c.want)continue;if(c.st==='in')add(c.want,1.5);else if(c.st==='rack'){const rk=byUid(c.rack);add(c.want,rk&&(rk.stock[c.want]||0)>0?1:4);}}
  for(const id of onSells()){add(id,Math.min(3,(G.lastSold[id]||0)/4));const rs=objs('rack',r=>rackAccepts(r,id));let n=0,cp=0;for(const r of rs){n+=r.stock[id]||0;cp+=rackCap(r);}if(cp&&n/cp<.25)add(id,2);if(cp&&n===0)add(id,2);}
  if(G.contract&&G.contract.got<G.contract.need)add(G.contract.item,2.5);G._dem=D;return D;}
function stockFill(id){let n=0,cp=0;for(const r of objs('rack',r=>rackAccepts(r,id))){n+=r.stock[id]||0;cp+=rackCap(r);}return cp?n/cp:1;}
function hamalTasks(h){const T=[];const bz=h.role==='burkazur';const D=demandMap();const dm=id=>D[id]||0;const lv=id=>Math.log10((IT[id]&&IT[id].sell?price(id):10)+10);
  if(!bz)for(const o of G.objs){if(o.k!=='st'||!o.out.length)continue;const id=o.out[o.out.length-1];const d=bestDest(id,o);if(!d)continue;
    let pri=id==='kizgin'?6:d.k==='rack'?6+2.2*dm(id)+(1-fillK(d))*3:d.k==='depo'?2:5;pri+=lv(id)+(o.out.length>=outCap(o.type)-1?4:0);if(d.k==='st'&&ST[d.type].combo)pri+=1.5*dm(comboOut(d));
    T.push({src:o,item:id,dst:d,n:o.out.length,pri});}
  const dp=depoObj();if(dp&&!bz){const C=G.contract;for(const id in dp.stock){if(!(dp.stock[id]>0))continue;
      if(C&&C.item===id&&C.got<C.need){const t=findObj('teslim');if(t)T.push({src:dp,item:id,dst:t,n:dp.stock[id],pri:8+lv(id)});continue;}
      const rk=objs('rack',r=>rackAccepts(r,id)&&fillK(r)<.6).sort((a,b)=>fillK(a)-fillK(b))[0];if(rk)T.push({src:dp,item:id,dst:rk,n:dp.stock[id],pri:4+2.5*dm(id)+(1-fillK(rk))*3+lv(id)});}}
  for(const s of objs('sup')){if(G.sup[s.item]<=0)continue;for(const st of objs('st',o=>ST[o.type].in.includes(s.item))){const room=inCap(st.type)-st.inp.length;if(room<2)continue;
      const S0=ST[st.type];const out=S0.combo?comboOut(st):S0.out==='kizgin'?'yatagan':S0.out;const f=out?stockFill(out):1;
      let pri=3+Math.min(4,room*.5)+(st.inp.length===0?2.5:0)+2.4*dm(out)+(1-f)*4+lv(out||'kulce');if(f>=.9&&stOutN(st)>=outCap(st.type)/2)pri-=9;
      T.push({src:s,item:s.item,dst:st,n:room,pri});}}
  const hc=bz?2:3+2*G.skill.hamal.guc,duty=G.shiftOn&&h.duty&&h.duty!=='auto'?h.duty:null;
  for(const t of T){const busy=G.workers.filter(w=>w!==h&&w.task&&w.task.src===t.src&&w.task.item===t.item&&w.task.dst===t.dst).length;const allow=Math.max(1,Math.ceil((t.n||1)/hc));if(busy>=allow)t.pri-=40;else t.pri-=busy*3;
    const same=G.workers.filter(w=>w!==h&&w.task&&w.task.item===t.item).length;t.pri-=same*1.2;
    const sx=t.src.x-h.x,sy=t.src.y-h.y;t.pri-=Math.sqrt(sx*sx+sy*sy)/380;
    if(duty){t.pri+=taskKind(t)===duty?30:-12;}}
  return T.sort((a,b)=>b.pri-a.pri);}
function hamalAI(h,dt){
  const sk=G.skill.hamal,bz=h.role==='burkazur',hs=(h.hunger<25?46:76)*(1+.2*sk.hiz)*(1+BF().hspd)*(bz?.7:1),hcap=bz?2:3+2*sk.guc;
  if(h.st==='idle'){if(h.stack.length){const top=h.stack[h.stack.length-1];const d=bestDest(top,h);if(d){h.task={src:null,item:top,dst:d};h.st='carry';const q=d.k==='st'?craftP(d):ip(d);goTo(h,q.x,q.y);}else if(SELLS.includes(top)){h.holdT=(h.holdT||0)+dt;follow(h,hs*.5,dt);}else{h.st='dump';h.t=0;const c=nearestK('cop',h);if(c){const q=ip(c);goTo(h,q.x,q.y);}}return;}
    const t=hamalTasks(h)[0];
    if(t){h.task=t;h.st='go';const q=t.src.k==='st'?trayP(t.src):ip(t.src);goTo(h,q.x+(Math.random()-.5)*10,q.y);}
    else{const kz=findObj('askazan');if(kz&&(!h.path||!h.path.length)&&Math.hypot(h.x-kz.x,h.y-kz.y)>60){const q=ip(kz);goTo(h,q.x-30+Math.random()*60,q.y+10);}follow(h,hs*.6,dt);}
    return;}
  const tk=h.task;
  if(h.st==='go'){if(follow(h,hs,dt)){h.st='load';h.t=0;}}
  else if(h.st==='load'){h.t+=dt;if(h.t>.2){h.t=0;const s=tk.src;
    if(h.stack.length<hcap){if(s.k==='sup'&&G.sup[s.item]>0&&(tk.dst.k!=='st'||h.stack.length<inCap(tk.dst.type)-tk.dst.inp.length)){G.sup[s.item]--;h.stack.push(s.item);sfx('pop',.25);return;}
      if(s.k==='depo'){const room=tk.dst.k==='rack'?rackCap(tk.dst)-rackN(tk.dst):tk.dst.k==='teslim'&&G.contract?G.contract.need-G.contract.got:0;if((s.stock[tk.item]||0)>0&&h.stack.length<room){s.stock[tk.item]--;h.stack.push(tk.item);sfx('pop',.25);return;}}
      if(s.k==='st'){const i=s.out.lastIndexOf(tk.item);if(i>=0){s.out.splice(i,1);h.stack.push(tk.item);sfx('pop',.25);return;}}}
    if(h.stack.length){h.st='carry';const q=tk.dst.k==='st'?craftP(tk.dst):ip(tk.dst);goTo(h,q.x+(Math.random()-.5)*10,q.y);}else{h.st='idle';h.task=null;}}}
  else if(h.st==='carry'){if(follow(h,hs,dt)){h.st='unload';h.t=0;h.stuck=0;}}
  else if(h.st==='unload'){h.t+=dt;if(h.t>.2){h.t=0;const d=tk.dst;if(!h.stack.length){h.st='idle';h.task=null;return;}
    const id=h.stack[h.stack.length-1];
    if(d.k==='st'&&stAccepts(d,id)){h.stack.pop();d.inp.push(id);sfx('drop',.25);return;}
    if(d.k==='teslim'&&G.contract&&G.contract.item===id&&G.contract.got<G.contract.need){h.stack.pop();deliver(id);sfx('drop',.25);return;}
    if(d.k==='rack'&&rackAccepts(d,id)&&rackN(d)<rackCap(d)){h.stack.pop();d.stock[id]=(d.stock[id]||0)+1;sfx('drop',.25);return;}

function hitObj(w){const L=G.objs.slice().sort((a,b)=>(isFlat(a)?0:1)-(isFlat(b)?0:1)||b.y-a.y);
  for(const o of L){const f=fpOf(o);const tall=o.k==='deco'&&o.d==='duvar_d'?50:isFlat(o)?4:46;if(w.x>f[0]-4&&w.x<f[2]+4&&w.y>f[1]-tall&&w.y<f[3]+6)return o;}return null;}

  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:ZOOM};joy.on=false;drag=null;pan=null;return;}
  if(paused)return;

    if(PAINT!==null){drag={paint:true};paintAt(w.x,w.y);return;}

    else{sel=null;pan={sx:e.clientX,sy:e.clientY,cx:camX,cy:camY};}

const FACTIONS=[['Uçmakan Kervanı',0,0],['Pâyendegan Elçiliği',6,-4],['Gökmızrak Alayı',6,-4,'gokmizrak'],['Azman Ocakları Levazımı',-4,7,'azman'],['Uykusuzlar Tarikatı',-2,5,'uykusuzlar'],['Küfkent Tuz Tüccarları',0,0],['Sürtünkaya Kaçakçıları',-3,-3]];

  [{t:'Kabul ✔'+(dd?dipBadge(F0[1],F0[2]):''),f:()=>{if(dd)dipShift(F0[1],F0[2],O.from);G.contract=G.offer;G.offer=null;if(!findObj('teslim'))addDef('teslim');toast('Sipariş kabul edildi!','Teslim sandığına '+G.contract.need+' '+IT[G.contract.item].ad.toLowerCase()+' bırak. Hamallar da taşır.',{item:G.contract.item});save();modalDone();}},

function sultanWish(){const on=onSells().slice().sort((a,b)=>price(b)-price(a));const pick=[];const pool=on.slice(0,Math.max(3,Math.ceil(on.length*.6)));while(pick.length<Math.min(3,pool.length)){const x=rnd(pool);if(!pick.includes(x))pick.push(x);}
  const q=clamp(2+Math.floor(G.day/12),2,14);return pick.map(id=>[id,q]);}
function announceCard(){const S0=G.sched;let body='';

  else body=`<p class="evl">"Haşmetşah Tospar Han, dev kurbağası Mahir'in sırtında Agreguk'a geliyor! Haşmetşahın sözü kanun, gazabı ölüm..."</p><p>İdiz: <b>"Ben... firariyim. Ya beni tanırsa?!"</b></p><p class="d">O sabah ne yapacağına karar vereceksin.</p>`;
  cardHTML('📯 HABER · '+(S0.day-G.day)+' GÜN SONRA',SP_NAME[S0.type],'',body,[{t:'Hazırlanalım!',f:modalDone}]);}
function spawnVIP(type){const S=SHOP();const v=[];const base={x:S.ex,y:WH+30,dir:1,walk:0,moving:false,seed:5,look:0,path:null,st:'in',t:0};
  if(type==='sultan'){v.push(Object.assign({},base,{kind:'sultan',skin:SPEC.sultan.skin}));v.push(Object.assign({},base,{kind:'muhafiz',x:S.ex-30,y:WH+60,skin:SPEC.muhafiz.skin,seed:6}));v.push(Object.assign({},base,{kind:'muhafiz',x:S.ex+30,y:WH+60,skin:SPEC.muhafiz.skin,seed:7}));
    v.forEach((q,i)=>{q.path=findPath(q.x,q.y,S.ex+(i-1)*40*(i?1:0)+(i===2?40:i===1?-40:0),S.y1-180-(i?0:20));});}
  else if(type==='reis'){const q=Object.assign({},base,{kind:'reis',skin:SPEC.reis.skin,hair:'#f2ead8',stops:4});q.path=findPath(q.x,q.y,S.ex,S.y1-140);v.push(q);}
  else if(type==='hasmet'){const q=Object.assign({},base,{kind:'hasmet',skin:SPEC.hasmet.skin});q.path=[[S.ex+120,S.y1+120]];v.push(q);}
  G.vips=v;}
function vipTick(dt){if(!G.vips)return;const S=SHOP();
  for(const q of G.vips){if(q.bub){q.bub.t-=dt;if(q.bub.t<=0)q.bub=null;}
    if(q.st==='in'){if(follow(q,q.kind==='hasmet'?55:62,dt)){q.st='here';q.t=0;
        if(q.kind==='sultan'){queueModal(sultanVisit);}
        if(q.kind==='hasmet'){say(q,rnd(['Bu dükkân... tanıdık kokuyor.','Mahir, yala bakalım şu tezgâhı!','Kim bu diz boyu esnaf?']),3);sfx('angry',.3);}
        if(q.kind==='reis')say(q,'Hmm. Bakalım...',2);}}
    else if(q.st==='here'){q.t+=dt;
      if(q.kind==='reis'){if(q.t>3&&q.stops>0){q.stops--;q.t=0;const rs=objs('rack');const r=rs.length?rnd(rs):null;if(r){q.path=findPath(q.x,q.y,r.x,fpOf(r)[3]+30);q.st='in';say(q,rnd(['Raf dolu mu?','Fiyat adil mi?','Hamalın karnı tok mu?','Müşteri güler yüz görüyor mu?']),2.4);}}
        else if(q.t>3&&q.stops<=0){q.st='out';q.path=findPath(q.x,q.y,S.ex,WH+40);}}
      else if(q.kind==='hasmet'&&q.t>9){q.st='out';q.path=[[S.ex+200,WH+40]];}
      else if(q.kind==='sultan'||q.kind==='muhafiz'){if(G.vipLeave){q.st='out';q.path=findPath(q.x,q.y,S.ex,WH+40);}}}
    else if(q.st==='out'){follow(q,70,dt);}}
  G.vips=G.vips.filter(q=>!(q.st==='out'&&q.y>=WH+20));if(!G.vips.length)G.vips=null;}
function takeFromRacks(id,n){let got=0;for(const r of objs('rack',r=>rackAccepts(r,id)).concat(objs('depo'))){const k=Math.min(n-got,r.stock[id]||0);r.stock[id]=(r.stock[id]||0)-k;got+=k;if(got>=n)break;}return got;}
function sultanVisit(){unlockLore('mirzinkul');const WL=G.sched.wish;const res=WL.map(([id,n])=>[id,n,takeFromRacks(id,n)]);let pay=0,full=true,gotN=0,needN=0;for(const [id,n,g] of res){pay+=price(id)*g*3;gotN+=g;needN+=n;if(g<n)full=false;}
  let extra='';const fav=dipOn()&&G.dip.s>=70;
  if(full){const hil=Math.round(WE()*1.5*(fav?1.5:1)/10)*10;pay+=hil;G.berat=Math.min(3,(G.berat||0)+1);dipShift(8,0,'Sultanın memnuniyeti');extra=`<p>Hil'at: <b>🪙 ${nudStr(hil)}</b>${fav?' (Pâyendegan himayesi ×1,5)':''}</p><p><b>📜 Sultan Beratı!</b> Bütün fiyatların kalıcı olarak %5 arttı (toplam %${G.berat*5}). Şöhretin yükseldi.</p>`;sfx('unlock');shake=4;}
  else if(gotN<needN/2){const fine=Math.round(WE()*.5/10)*10;pay-=fine;dipShift(-8,0,'Ölçüsüz dükkân');extra=`<p style="color:#c9463d">"Ölçüsüz, eksik! Bu Pâyendegan'a hakarettir." Ölçüsüzlük cezası: <b>−🪙 ${nudStr(fine)}</b></p>`;}
  pay=Math.round(pay);G.nud+=pay;G.today.ozel+=pay;
  cardHTML('👑 SULTANIN ZİYARETİ','Sultan Mirzinkul Bellini',full?'"Ölçülü, eksiksiz. Hesabım tuttu."':'"Hesap tutmadı... Yine de alalım."',itemsHTML(res.map(([id,n,g])=>[id,g+'/'+n,g>=n]))+`<p>Sultan malın üç katını saydı. Toplam: <b>${pay<0?'−':''}🪙 ${nudStr(Math.abs(pay))}</b></p>`+extra,[{t:'Devam ▸',f:()=>{G.vipLeave=true;modalDone();}}]);}
function hasmetChoice(){const hasK=roleCount('katip')>0;unlockLore('tospar');
  if(dipOn()&&G.dip.h>=70){const v=gainW(1.5);G.today.ozel+=v;dipShift(0,3,'Haşmetşahın keyfi');cardHTML('🐸 HAŞMETŞAH BUGÜN PAZARDA','Tospar Han ve Mahir','Dermançöl dostluğu işe yaradı',`<p class="evl">Tospar Han dükkânın önünde durdu, İdiz'e uzun uzun baktı. "Bu Yavşuk... bizim mallarımızı pazara sokan dükkân bu mu? Aferin." Mahir tezgâhı yaladı. Kimse firariyi sormadı.</p><p>Haşmetşah bir sandık mal aldı: <b>🪙 ${nudStr(v)}</b></p>`,[{t:'Oh be ▸',f:modalDone}]);return;}

function hasmetRoll(){evCard.innerHTML=`<div class="evh">🐸 TAKMA SAKAL</div><h2>Zar at!</h2><div id="evDie">${d20svg(20)}</div>${dcHTML(11,'Kılık değiştirme')}${dipOn()&&G.dip.h<=25?'<div class="d">Dermançöl şüphesi: zara −4</div>':''}${BF().d20?'<div class="d">Uğurlu eşyalar: zara +'+BF().d20+'</div>':''}<div id="evR"></div><button class="btn" id="evB">🎲 Zarı At</button>`;

  document.getElementById('evB').onclick=()=>{const b=document.getElementById('evB');b.disabled=true;const die=document.getElementById('evDie');let k=0;const pen=dipOn()&&G.dip.h<=25?4:0;const raw=1+Math.floor(Math.random()*20);const fin=raw===20?20:raw===1?1:clamp(raw-pen+(BF().d20||0),1,20);

function reisReport(){const t=G.today;const vis=t.sold+t.lost;const empty=objs('rack').filter(r=>rackN(r)===0).length;
  const crit=[['Müşteri memnun',vis>0&&t.lost/vis<=.15],['Raflar dolu',empty<=1],['Çalışanlar tok',t.mani===0],['Favorisini bulan müşteri',t.favs>=2]];
  const n=crit.filter(c=>c[1]).length;let res,val=0;
  const A=WE();if(n===4){val=Math.round(Math.max(3000,A*1.5));G.reisMuhur=Math.min(3,(G.reisMuhur||0)+1);res='🏅 Reis\'in Övgüsü! Reis Mührü kazandın (şöhret +).';}
  else if(n===3){val=Math.round(Math.max(1500,A*.6));res='👍 Reis memnun.';}
  else if(n===2){res='😐 Reis bir şey demedi. Uçmakan suskunluğu övgü değildir.';}
  else{val=-Math.round(Math.min(G.nud*.5,Math.max(300,A*.8)));G.ucBanUntil=G.day+3;res='👎 Reis kızdı! Ceza kesildi, Uçmakanlar 3 gün dükkânına uğramayacak.';}
  G.nud+=val;t.ozel+=val;return{crit,res,val};}

/* ====================== ÖLÇEK, DEĞİŞTİRİCİLER ====================== */
let AUTOPLAY=false,SPEED=1;const CUST_MAX=26;
function WE(){return Math.max(600,avgEarn()+kervanPay());}
function MOD(k){let v=1;if(!G||!G.mods)return 1;for(const m of G.mods)if(m.k===k&&m.until>=G.day)v*=m.v;return v;}
function addMod(k,v,days,ad){G.mods.push({k,v,until:G.day+days,ad});}
function pruneMods(){G.mods=(G.mods||[]).filter(m=>m.until>=G.day);}
function modList(){const seen={};return (G.mods||[]).filter(m=>m.until>=G.day&&m.ad).filter(m=>{const key=m.ad+m.until;if(seen[key])return false;seen[key]=1;return true;});}
function payW(k){const v=Math.round(WE()*k/10)*10;G.nud-=v;return v;}
function gainW(k){const v=Math.round(WE()*k/10)*10;G.nud+=v;return v;}

/* ====================== DİPLOMASİ ====================== */
function dipOn(){return G.day>=15&&!G.ended;}
function dipEff(){const e={race:{},tags:[]};if(!G||!G.dip||!dipOn())return e;const d=G.dip;
  if(d.s>=70){e.race.insan=1.35;e.race.puhusoy=1.35;e.race.gaksoy=1.35;e.tags.push(['♛','Pâyendegan himayesi','İnsan, Puhusoy, Gaksoy müşteri +%35']);}
  else if(d.s<=25){e.race.insan=.55;e.race.puhusoy=.55;e.race.gaksoy=.55;e.tags.push(['♛','Pâyendegan ambargosu','İnsan, Puhusoy, Gaksoy müşteri −%45']);}
  if(d.h>=70){e.race.yasruk=1.35;e.race.tirmik=1.35;e.rawMul=.85;e.tags.push(['🐸','Dermançöl dostluğu','Yaşruk, Tırmıksoy +%35 · hammadde −%15']);}
  else if(d.h<=25){e.thief=1.7;e.tags.push(['🐸','Dermançöl şüphesi','Geceleri casus ve hırsız çok']);}
  if(d.s>=45&&d.h>=45&&Math.abs(d.s-d.h)<=20){e.priceMul=1.08;e.tags.push(['⚖','Arras\'ın dengesi','Bütün fiyatlar +%8']);}
  return e;}
function dipShift(ds,dh,why){if(!G.dip)G.dip={s:50,h:50};G.dip.s=clamp(G.dip.s+ds,0,100);G.dip.h=clamp(G.dip.h+dh,0,100);
  if(dipOn()&&(ds||dh))toast('Diplomasi: '+(why||''),(ds?'♛ Sultan '+(ds>0?'+':'')+ds+'  ':'')+(dh?'🐸 Haşmetşah '+(dh>0?'+':'')+dh:''));}
function dipBadge(ds,dh){const f=(ic,v)=>v?`<span style="color:${v>0?'#3f8a3a':'#c9463d'}">${ic}${v>0?'+':''}${v}</span>`:'';return (ds||dh)?`<span style="font-size:11px;display:block;margin-top:2px">${f('♛',ds)} ${f('🐸',dh)}</span>`:'';}
function dipBar(){const d=G.dip;return `<div class="dip"><div><b>♛ Pâyendegan Sultanı</b><i><u style="width:${d.s}%;background:#3f6aa0"></u></i><span>${Math.round(d.s)}</span></div><div><b>🐸 Dermançöl Haşmetşahı</b><i><u style="width:${d.h}%;background:#8a2a3a"></u></i><span>${Math.round(d.h)}</span></div></div>`;}

function caravanX(){return SHOP().x0+62;}
function startCaravan(items,burk){const x=caravanX();G.camels={x,y:WH+70,st:'in',t:0,items,burk:!!burk,walk:0,n:Math.min(4,1+Math.ceil(items.length/2))};}
function caravanTick(dt){const C=G.camels;if(!C)return;const stopY=SY1+92;C.walk+=dt;
  if(C.st==='in'){C.y-=150*dt;if(C.y<=stopY){C.y=stopY;C.st='unload';C.t=0;sfx('thump',.5);}}
  else if(C.st==='unload'){C.t+=dt;if(Math.random()<dt*10)fx('star',C.x+(Math.random()-.5)*30,C.y-50,{vx:(Math.random()-.5)*60+50,vy:-120,t:.6});
    if(C.t>1.4){C.st='out';deliverCaravan();}}
  else if(C.st==='out'){C.y+=150*dt;if(C.y>WH+90)G.camels=null;}}
function deliverCaravan(){const C=G.camels;const D=G.delivery||{};const got=[];
  for(const r in D){const n=D[r];if(!n)continue;G.sup[r]=Math.min(supCap(r),(G.sup[r]||0)+n);got.push(n+' '+IT[r].ad.toLowerCase());}
  G.delivery=null;sfx('register',.5);
  toast('Kervan geldi! 🐪',got.length?got.join(', ')+' sandıklarda.':'Develer yükünü indirdi.',{item:'kulce'});
  if(C&&C.burk&&!G.workers.some(w=>w.role==='burkazur')){const w=hireWorker('burkazur',true);if(w){w.x=C.x+20;w.y=C.y-10;w.molaT=20;say(w,'Selam! Ben Burkazur. Dayım kervancıbaşı. Sandık taşıyacakmışım. Rafa koymam ama, söyleyeyim.',4.5);}
    queueModal(()=>cardHTML('🐪 KERVANDAN BİR HEDİYE','Burkazur','Kervancıbaşının yeğeni, Yaşruk hamal',`<p class="evl">"Dayım dedi ki: 'Git şu diz boyu Yavşuğa yardım et, belki adam olursun.' Ben zaten adamım. Yaşruğum hatta, adamdan büyüğüm."</p><p>Burkazur bedava çalışır ama yavaştır; yalnız sandıktan tezgâha hammadde taşır. Bir de çok konuşur. Çok.</p>`,[{t:'Hoş geldin... galiba',f:modalDone}]));}}
function camel(x,y,dir,walk,bag,k){g.save();g.translate(x,y);g.scale((k||1)*dir,k||1);shadow(0,2,28,6);const ph=walk*7,C='#d8a868',D='#c08a4e';
  [[-15,0,D],[11,Math.PI*.5,D],[-9,Math.PI,C],[17,Math.PI*1.5,C]].forEach(([lx,o,c])=>{const a=Math.sin(ph+o)*.32;g.save();g.translate(lx,-26);g.rotate(a);rr(-2.4,0,4.8,14,2);F(c);S(1.4);g.translate(0,13);g.rotate(-a*.6);rr(-2.2,0,4.4,13,2);F(c);S(1.4);rr(-3,11,6,3,1.5);F('#8a6a4a');g.restore();});
  g.beginPath();g.moveTo(-22,-34);g.quadraticCurveTo(-29,-28,-26,-20);S(2,D);
  g.beginPath();g.ellipse(0,-33,23,11,0,0,Math.PI*2);F(C);S(2);
  g.beginPath();g.moveTo(-14,-38);g.quadraticCurveTo(-4,-58,8,-38);F(C);S(2);
  if(bag){rr(-16,-42,11,15,3);F(bag[0]);S(1.4);rr(5,-42,11,15,3);F(bag[1]||bag[0]);S(1.4);g.beginPath();g.moveTo(-12,-44);g.quadraticCurveTo(-3,-54,6,-44);S(4,'#c9463d');}
  g.beginPath();g.moveTo(15,-40);g.quadraticCurveTo(25,-41,26,-58);g.lineTo(34,-58);g.quadraticCurveTo(34,-34,20,-25);g.closePath();F(C);S(2);
  g.save();g.translate(31,-61+Math.sin(ph*.5)*1);g.beginPath();g.ellipse(2,0,10,6,.1,0,Math.PI*2);F(C);S(1.8);circ(0,-2,1.3);F(OL);g.beginPath();g.moveTo(9,1);g.lineTo(11,2);S(1.2);
  g.beginPath();g.ellipse(-6,-5,2.2,3.4,-.5,0,Math.PI*2);F(D);S(1.2);g.restore();
  g.restore();}
const BAGC={tuz:'#f2ead8',kulce:'#6a6f78',yun:'#f2ead8',kagit:'#e8dcc0',deri:'#b0703e',ot:'#6aa860',kum:'#e0c890'};
function drawCaravan(C){const n=C.n,dir=-1;const bags=C.items.length?C.items:['kulce'];const mv=C.st!=='unload';
  for(let i=n-1;i>=0;i--){const y=C.y+18+i*58,x=C.x+(i%2?6:-4);const b=bags[i%bags.length];camel(x,y,1,mv?C.walk+i*.7:0,[BAGC[b]||'#c9a56c',BAGC[bags[(i+1)%bags.length]]||'#c9a56c'],.85);}

function burkTick(w,dt,day){w.hunger=100;
  if(!day||w.off){if(w.st!=='rest'){w.st='rest';w.task=null;}if(!w.bub&&Math.random()<dt*.04)say(w,day?'İzinliyim. Dayıma yazıyorum.':'Zzz... sandık... boş sandık... zzz',2.6);if(w.stack.length)w.stack=[];return;}
  if(w.st==='rest')w.st='idle';
  w.molaT=(w.molaT==null?25:w.molaT)-dt;
  if(w.st==='mola'){w.t-=dt;w.moving=false;if(w.t<=0){w.st='idle';w.molaT=22+Math.random()*14;}return;}

  if(!w.bub&&Math.random()<dt*.07)say(w,rnd(BURK_L),3.4);

function depoFor(id){const d=depoObj();if(!d||!SELLS.includes(id)||depoN(d)>=depoCap())return null;return d;}
function buyDepo(){if(depoObj()||!pay(DEPO_COST))return;const o=mkObj({k:'depo',stock:{}},DEF.depo[0],DEF.depo[1]);o.stock={};sfx('unlock');shake=3;toast('Depo kuruldu! 📦','Rafa sığmayan mal artık çöpe değil depoya gider. Raf boşalınca hamallar geri getirir.',{item:'zirh'});after();}

function fillAll(silent){let spent=0,guard=0,did=true;const rs=RAWS.filter(r=>findObj('sup',o=>o.item===r));
  while(did&&guard++<400){did=false;for(const r of rs){const room=supCap(r)-G.sup[r]-G.order[r];const pr=rawPrice(r);if(room<=0||G.nud<pr)continue;const n=Math.min(2,room);if(G.nud<pr*n)continue;G.nud-=pr*n;G.order[r]+=n;G.orderSpent+=pr*n;spent+=pr*n;did=true;}}
  if(!silent){if(spent){sfx('coin',.7);toast('Sandıklar dolacak 🧺','Yarın sabahki kervana '+nudStr(spent)+' nüdlük mal yazıldı.');}else toast('Yazacak bir şey yok','Sandıklar zaten dolu ya da kese dar.');}
  return spent;}
function fillCost(){let c=0;for(const r of RAWS){if(!findObj('sup',o=>o.item===r))continue;c+=Math.max(0,supCap(r)-G.sup[r]-G.order[r])*rawPrice(r);}return c;}

const LANES=[{p:'yatagan',sup:'kulce',st:['ocak','ors']},{p:'zirh',sup:'yun',st:['kece']},{p:'parsomen',sup:'kagit',st:['hokka']},{p:'carik',sup:'deri',st:['deri']},{p:'iksir',sup:'ot',st:['imbik']},{p:'billur',sup:'kum',st:['camocak']},{p:'vitrin',sup:null,st:['efsun']},{p:'simya',sup:null,st:['simya']}];
const PLAN_DESIGN_COST=2500,AISLE=46;
function placeAnchor(o){const S=SHOP();const key=o.k==='st'?o.type:o.k==='rack'?'rack_'+o.item:o.k==='sup'?'sup_'+o.item:o.k;const d=DEF[key];
  if(d&&d[0]>S.x0+20&&d[0]<S.x1-20&&d[1]>S.y0+40&&d[1]<S.y1)return d;return[(S.x0+S.x1)/2,S.y1-200];}
function fpW(o){const f=o.k==='deco'?DECO[o.d].fp:o.k==='st'?ST[o.type].fp:FP[o.k];return f;}
/* Akış yerleşimi: soldan sağa, kapı koridorunu atlayarak, satır satır geriye */
function flowRows(groups,yStart,rowH,gap,S){const out=[];let y=yStart,cx=S.x0+16;const L=DOOR_X-AISLE,Rr=DOOR_X+AISLE;
  const fit=(o)=>{const f=fpW(o);let x=cx-f[0];if(x+f[0]<Rr&&x+f[2]>L){cx=Rr;x=cx-f[0];}if(x+f[2]>S.x1-14)return null;return x;};
  for(const grp of groups){let w=0;for(const o of grp){const f=fpW(o);w+=f[2]-f[0]+gap;}
    const room=(S.x1-14)-cx-(cx<L&&cx+w>L?2*AISLE:0);if(w>room&&cx>S.x0+16){y-=rowH;cx=S.x0+16;}
    for(const o of grp){let x=fit(o);if(x==null){y-=rowH;cx=S.x0+16;x=fit(o);}if(x==null)x=cx;out.push([o,x,y]);cx=x+fpW(o)[2]+gap;}}
  return{pl:out,y};}
function layoutPlan(){const S=SHOP();const objsIn=G.objs.filter(o=>o.k!=='deco'&&o.k!=='kiosk'&&o.k!=='depo');const pos=[];
  const kas=objsIn.filter(o=>o.k==='kasa');kas.forEach((o,k)=>pos.push([o,DOOR_X+AISLE+52+150*k,S.y1-108]));
  const az=objsIn.find(o=>o.k==='askazan');if(az)pos.push([az,S.x0+56,S.y1-104]);const ts=objsIn.find(o=>o.k==='teslim');if(ts)pos.push([ts,S.x0+150,S.y1-104]);
  objsIn.filter(o=>o.k==='cop').forEach((o,k)=>pos.push([o,S.x1-30-34*k,S.y1-34]));
  const racks=[];for(const L0 of LANES)for(const r of objsIn.filter(o=>o.k==='rack'&&o.item===L0.p))racks.push([r]);
  const rk=flowRows(racks,S.y1-236,118,30,S);pos.push(...rk.pl);
  const groups=[];for(const L0 of LANES){const g=[];const sp=L0.sup&&objsIn.find(o=>o.k==='sup'&&o.item===L0.sup);if(sp)g.push(sp);
    if(L0.st.length===2){const oc=objsIn.filter(o=>o.k==='st'&&o.type==='ocak'),or=objsIn.filter(o=>o.k==='st'&&o.type==='ors');for(let i=0;i<Math.max(oc.length,or.length);i++){if(oc[i])g.push(oc[i]);if(or[i])g.push(or[i]);}}
    else g.push(...objsIn.filter(o=>o.k==='st'&&o.type===L0.st[0]));if(g.length)groups.push(g);}
  const pr=flowRows(groups,rk.y-158,128,22,S);pos.push(...pr.pl);
  return{pos,rackBack:rk.y-60,prodBack:pr.y};}
function paintPlan(L){const S=SHOP();const c0=Math.ceil((S.x0-8)/TILE),c1=Math.floor((S.x1+8)/TILE)-1,r0=Math.ceil((S.y0-20)/TILE),r1=Math.floor((S.y1+4)/TILE)-1;
  for(let c=c0;c<=c1;c++)for(let r=r0;r<=r1;r++){if(!cellZone(c,r))continue;const x=c*TILE+TILE/2,y=r*TILE+TILE/2;let t;
    if(Math.abs(x-DOOR_X)<AISLE+4&&y>L.prodBack-60)t=(r%2?6:2);else if(y>S.y1-150)t=3;else if(y>L.rackBack)t=((c+r)%2?0:4);else t=1;G.tiles[c+','+r]=t;}BG=null;}
function snapPlan(){const pos={};for(const o of G.objs)pos[o.uid]=[o.x,o.y];G.preplan={pos,tiles:Object.assign({},G.tiles)};}
function applyPlan(){if(!G.preplan)snapPlan();const L=layoutPlan();const moved=new Set();
  for(const [o] of L.pos){o.x=-999;o.y=-999;}const decoIn=G.objs.filter(o=>o.k==='deco'&&whereOf(o).includes('in')&&zoneOf(fpOf(o))==='in');for(const o of decoIn){o.x=-999;o.y=-999;}
  for(const [o,x,y] of L.pos){o.x=Math.round(x/2)*2;o.y=Math.round(y/2)*2;if(!validPos(o))placeNear(o,o.x,o.y);moved.add(o);}
  const S=SHOP();const flats=decoIn.filter(isFlat),solid=decoIn.filter(o=>!isFlat(o));let fy=S.y1-180;
  for(const o of flats){placeNear(o,DOOR_X,fy);fy-=110;}
  let k=0;for(const o of solid){const side=k%2,row=Math.floor(k/2);const x=side?S.x1-30:S.x0+24,y=S.y1-170-row*60;if(!placeNear(o,x,y))placeNear(o,(S.x0+S.x1)/2,S.y1-200);k++;}
  paintPlan(L);
  for(const w of G.workers){if(ROLES[w.role].st){const o=byUid(w.a);if(o){const c=craftP(o);w.x=c.x;w.y=c.y;}}else if(w.role==='hamal'||w.role==='burkazur'){w.path=null;w.task=null;if(!w.stack.length)w.st='idle';}}
  GRID=null;WALLC=null;fixObjs();G._dirty=false;}
function revertPlan(){const P=G.preplan;if(!P)return;G.plan=false;for(const o of G.objs){const q=P.pos[o.uid];if(q){o.x=q[0];o.y=q[1];}}G.tiles=Object.assign({},P.tiles);G.preplan=null;BG=null;GRID=null;WALLC=null;
  for(const o of G.objs){if(!P.pos[o.uid]||!validPos(o)){const a=placeAnchor(o);placeNear(o,a[0],a[1]);}}
  for(const w of G.workers){if(ROLES[w.role].st){const o=byUid(w.a);if(o){const c=craftP(o);w.x=c.x;w.y=c.y;}}else{w.path=null;w.task=null;}}fixObjs();sfx('pop');toast('Eski düzene dönüldü','Mimarın planı kaldırıldı. İstersen İnşaat\'tan yeniden uygulatabilirsin.');}

  const ob=objective();if(ob&&ob[1]){const o=ob[1];const f=fpOf(o);let ax=o.x;if(o.k==='st'&&ob[0].includes('SAĞ'))ax=o.x+ST[o.type].tray;arrowAt(ax,f[1]-56);}
