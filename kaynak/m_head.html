<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>İdiz'in Tezgâhı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#e6c48c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:Fredoka,system-ui,sans-serif;color:#4a3226}
canvas{display:block;position:fixed;inset:0}
.pill{font:600 14px Fredoka,system-ui,sans-serif;background:#fff7e6;color:#4a3226;border:2.5px solid #4a3226;border-radius:16px;padding:5px 11px;box-shadow:0 3px 0 #4a3226;cursor:pointer}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 #4a3226}
#menuBtn{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:5;display:none;font-size:18px;padding:3px 12px}
#zoom{position:fixed;right:10px;top:calc(120px + env(safe-area-inset-top));z-index:4;display:none;flex-direction:column;gap:6px}
#zoom .pill{width:40px;height:36px;padding:0;font:700 18px Fredoka,system-ui,sans-serif}
.mslot{display:flex;align-items:center;gap:8px;background:#fffdf6;border:2.5px solid #4a3226;border-radius:14px;padding:8px 10px;margin:6px 0;text-align:left}
.mslot .t{flex:1}.mslot .n{font:700 15px Fredoka,system-ui,sans-serif}.mslot .d{font-size:12px}
.mslot .buy{padding:6px 9px}.mslot .del{background:#ffc0b0}
.mbtn{display:block;width:100%;margin:6px 0;font:400 19px 'Lilita One',Fredoka,sans-serif;background:#f0b43c;color:#4a3226;border:3px solid #4a3226;border-radius:14px;box-shadow:0 3px 0 #4a3226;padding:8px;cursor:pointer}
.mbtn.sec{background:#fff7e6}.mbtn[disabled]{opacity:.5}
.how{text-align:left;font-size:13.5px;line-height:1.35}.how b{color:#c9463d}
#bar{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:none;justify-content:center;flex-wrap:wrap;gap:8px;z-index:4;pointer-events:none;padding:0 6px}
#bar .pill{pointer-events:auto;font:400 16px 'Lilita One',Fredoka,sans-serif;padding:8px 11px;border-radius:16px;white-space:nowrap}
#bar .glow{background:#ffe48a;animation:pulse 1s infinite}
#bar .sleep{background:#c9d8ff}
#bar .done{background:#9fe08a}
#bar .sell{background:#ffc0b0}
#bar .on{background:#9fd0ff}
@keyframes pulse{50%{transform:scale(1.07)}}
#pal{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));display:none;justify-content:center;gap:6px;z-index:4}
#pal button{width:46px;height:46px;border:3px solid #4a3226;border-radius:12px;cursor:pointer;box-shadow:0 3px 0 #4a3226;font:700 11px Fredoka,system-ui,sans-serif;color:#4a3226;background-size:cover}
#pal button.sel{outline:4px solid #f0b43c;transform:translateY(-3px)}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,26,38,.55);z-index:6;padding:20px;box-sizing:border-box}
.card{background:#fff7e6;border:3px solid #4a3226;border-radius:22px;box-shadow:0 6px 0 #4a3226;padding:18px 20px;max-width:340px;width:100%;text-align:center;max-height:88vh;overflow-y:auto}
.card h2{font:400 30px 'Lilita One',Fredoka,sans-serif;margin:0 0 6px;color:#c9463d}
.card p{font-size:16px;margin:8px 0;line-height:1.25;font-weight:500}
.card b{color:#3f8a3a}
.stats{display:grid;grid-template-columns:1fr auto;gap:3px 12px;text-align:left;font-weight:600;font-size:14.5px;margin:10px 4px}
.stats span:nth-child(even){text-align:right}
.stats .hd{font-weight:700;color:#8a6a50;font-size:12.5px;letter-spacing:.5px;margin-top:4px}
.stats .tot{font-weight:700;font-size:18px;border-top:2px solid #4a3226;padding-top:4px}
.btn{font:400 21px 'Lilita One',Fredoka,sans-serif;background:#f0b43c;color:#4a3226;border:3px solid #4a3226;border-radius:16px;box-shadow:0 4px 0 #4a3226;padding:8px 22px;margin-top:8px;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #4a3226}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:76%;background:#fff7e6;border-top:3px solid #4a3226;border-radius:24px 24px 0 0;z-index:7;display:flex;flex-direction:column;box-shadow:0 -4px 0 rgba(74,50,38,.25)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
.sheet-h span{font:400 24px 'Lilita One',Fredoka,sans-serif;color:#c9463d}
.sheet-h .nud{font:700 16px Fredoka,system-ui,sans-serif;color:#4a3226;background:#ffe9a0;border:2px solid #4a3226;border-radius:12px;padding:2px 10px;margin-left:auto;margin-right:10px}
.sheet{overflow:hidden}.sheet-h{flex:none}
.tabs{flex:none;display:flex;gap:6px;padding:4px 14px 8px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x;scrollbar-width:none;align-items:center;min-height:40px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;white-space:nowrap;line-height:1.15;height:32px;box-sizing:border-box;font:600 14px Fredoka,system-ui,sans-serif;border:2.5px solid #4a3226;border-radius:12px;background:#f4e2bd;color:#4a3226;padding:6px 12px;cursor:pointer}
.tabs button.on{background:#f0b43c}
#catBody{flex:1;min-height:0;overflow-y:auto;padding:4px 14px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;touch-action:pan-y}
.item{display:flex;gap:10px;align-items:center;background:#fffdf6;border:2.5px solid #4a3226;border-radius:16px;padding:8px;margin-bottom:8px}
.item img{width:56px;height:56px;border-radius:12px;background:#f4e2bd;border:2px solid #d9c49a;flex:none}
.item .t{flex:1;min-width:0}
.item .n{font:700 15.5px Fredoka,system-ui,sans-serif}
.item .d{font:500 12.5px Fredoka,system-ui,sans-serif;color:#6a5040;line-height:1.2;margin-top:2px}
.d{font:500 13px Fredoka,system-ui,sans-serif;color:#6a5040}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font:600 11px Fredoka,system-ui,sans-serif;background:#e3f3d8;border:1.5px solid #6aa060;border-radius:8px;padding:1px 6px}
.chip.f{background:#ffe9a0;border-color:#c9a030}
.buy{font:700 14px Fredoka,system-ui,sans-serif;background:#f0b43c;border:2.5px solid #4a3226;border-radius:12px;box-shadow:0 3px 0 #4a3226;padding:7px 9px;cursor:pointer;white-space:nowrap}
.buy[disabled]{background:#e4d6bd;color:#9a8a70;box-shadow:none}
.att{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 10px}
.att span{font:600 12px Fredoka,system-ui,sans-serif;background:#fffdf6;border:2px solid #4a3226;border-radius:10px;padding:2px 8px}
.sec{font:700 12.5px Fredoka,system-ui,sans-serif;color:#8a6a50;margin:8px 2px 6px;text-transform:uppercase;letter-spacing:.5px}
.step{display:flex;align-items:center;gap:8px;margin-top:6px}
.step button{min-width:34px;width:auto;padding:0 6px;height:30px;font:700 18px Fredoka,system-ui,sans-serif;border:2.5px solid #4a3226;border-radius:10px;background:#f0b43c;box-shadow:0 2px 0 #4a3226;cursor:pointer}
.step b{min-width:26px;text-align:center;font:700 17px Fredoka,system-ui,sans-serif}
.step span{margin-left:auto;font:700 14px Fredoka,system-ui,sans-serif;color:#8a6a50}
.lv{display:flex;gap:3px;margin-top:4px}.lv i{width:14px;height:6px;border-radius:3px;background:#e4d6bd;border:1.5px solid #4a3226}.lv i.f{background:#7fd06a}
.dlgc{display:flex;gap:12px;align-items:flex-start;text-align:left;max-width:420px;margin-bottom:calc(20px + env(safe-area-inset-bottom));flex-wrap:wrap}
.dlgc img{width:64px;height:64px;border-radius:14px;background:#f4e2bd;border:2px solid #d9c49a}
.dlgc .dt{flex:1;min-width:180px}.dlgc .who{font:400 20px 'Lilita One',Fredoka,sans-serif;color:#c9463d}.dlgc p{margin:4px 0 0;font-size:16px}
.dlgc .btn{margin-left:auto;font-size:18px;padding:6px 18px}
.dc{margin:2px auto 8px;display:inline-flex;flex-direction:column;align-items:center;background:#4a3226;color:#ffe9b8;border-radius:12px;padding:5px 14px;font:600 12px Fredoka,system-ui,sans-serif}.dc b{font:400 22px 'Lilita One',Fredoka,sans-serif;color:#ffd34c;letter-spacing:1px}.dc span{font-size:10.5px;opacity:.8}
.dip{background:#fffdf6;border:2px solid #4a3226;border-radius:12px;padding:6px 9px;margin:8px 0;font:600 12px Fredoka,system-ui,sans-serif}
.dip>div{display:flex;align-items:center;gap:6px;margin:3px 0}.dip b{flex:none;width:150px;font-weight:700}.dip i{flex:1;height:9px;background:#eadbb8;border-radius:5px;overflow:hidden;border:1.5px solid #4a3226}.dip u{display:block;height:100%}.dip span{width:24px;text-align:right}
.ktab{display:flex;gap:6px;margin:4px 0 8px}.ktab button{flex:1;font:700 14px Fredoka,system-ui,sans-serif;border:2.5px solid #4a3226;border-radius:12px;background:#fff7e6;padding:6px}.ktab button.on{background:#f0b43c}
.lore{background:#fffdf6;border:2.5px solid #4a3226;border-radius:14px;padding:8px 10px;margin:7px 0}.lore .n{font:700 15px Fredoka,system-ui,sans-serif}.lore p{font:500 13px Fredoka,system-ui,sans-serif;color:#5a4030;margin:4px 0 0;line-height:1.35}
#zoom .pill.on{background:#f0b43c}
.kod{display:flex;gap:10px;align-items:center;background:#fffdf6;border:2.5px solid #4a3226;border-radius:14px;padding:7px 9px;margin:7px 0}
.kod>img,.kod .unk{width:48px;height:48px;border-radius:12px;background:#f4e2bd;border:2px solid #d9c49a;flex:none}
.kod .unk{display:flex;align-items:center;justify-content:center;font:400 26px 'Lilita One',Fredoka,sans-serif;color:#8a6a50}
.kod .n{font:700 15px Fredoka,system-ui,sans-serif;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.kod .fav{display:inline-flex;align-items:center;gap:3px;font:600 12px Fredoka,system-ui,sans-serif;background:#ffe0ec;border:1.5px solid #c94a8a;border-radius:9px;padding:0 7px 0 2px}
.kod .fav img{width:20px;height:20px}
.kod .q{font:500 13px Fredoka,system-ui,sans-serif;color:#5a4030;font-style:italic;margin-top:2px;line-height:1.25}
.evcard{background:linear-gradient(#fff7e6,#f6e3bd);border-color:#4a3226}
.evh{font:700 12px Fredoka,system-ui,sans-serif;letter-spacing:1.5px;color:#8a6a50}
.evs{font:600 14px Fredoka,system-ui,sans-serif;color:#6a3a8a;margin-top:-2px}
.evl{font-style:italic;color:#5a4030}
.d20{width:96px;height:96px;margin:6px auto;display:block;filter:drop-shadow(0 4px 0 rgba(74,50,38,.35))}
.d20.spin{animation:d20s .18s linear infinite}.d20.land{animation:d20l .45s ease-out}
@keyframes d20s{to{transform:rotate(360deg) scale(.92)}}@keyframes d20l{0%{transform:scale(1.5)}60%{transform:scale(.9)}100%{transform:scale(1)}}
.tier{font:400 22px 'Lilita One',Fredoka,sans-serif;margin-top:4px}.t0{color:#a8201a}.t1{color:#c9463d}.t2{color:#8a6a50}.t3{color:#3f8a3a}.t4{color:#d89a10;text-shadow:0 2px 0 #4a3226}
.recs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px 66px}.recs button{display:flex;align-items:center;gap:3px;font:600 11.5px Fredoka,system-ui,sans-serif;border:2px solid #4a3226;border-radius:10px;background:#fff7e6;padding:2px 7px 2px 2px;cursor:pointer}.recs button.on{background:#c9a0ff}.recs img{width:24px;height:24px}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="menuBtn" class="pill">☰</button><div id="zoom"><button class="pill" id="zSpd" title="Hızlı mod">▶</button><button class="pill" id="zIn">＋</button><button class="pill" id="zOut">－</button><button class="pill" id="zHome" title="Eve bak">⌂</button><button class="pill" id="zKod" title="Kodeks">📜</button></div>
<div id="pal"></div>
<div id="bar"><button id="bOrd" class="pill">📦 Sipariş</button><button id="bCat" class="pill">🛒 Defter</button><button id="bEdit" class="pill">🛠 Düzenle</button><button id="bPaint" class="pill hidden">🧱 Zemin</button><button id="bSell" class="pill sell hidden">↩ Sat</button><button id="bSleep" class="pill sleep">💤 Uyu</button></div>
<div class="sheet hidden" id="cat"><div class="sheet-h"><span>Gece Defteri</span><b class="nud" id="catNud"></b><button class="pill" id="catX">✕</button></div>
<div class="tabs"><button data-t="siparis" class="on">📦 Sipariş</button><button data-t="atolye">⚒ Atölye</button><button data-t="urun">💎 Ustalık</button><button data-t="ekip">👥 Ekip</button><button data-t="gelisim">💪 İdiz</button><button data-t="insaat">🏗 İnşaat</button><button data-t="sus">🪴 Süs</button><button data-t="bahce">🌳 Bahçe</button><button data-t="guv">🛡 Güvenlik</button><button data-t="tellal">📣 Tellal</button><button data-t="meclis">🏛 Meclis</button></div><div id="catBody"></div></div>
<div class="ov hidden" id="sum"><div class="card"><h2 id="sumH">Gün bitti</h2><div class="stats" id="sumS"></div><p id="sumP"></p><button class="btn" id="sumBtn">Geceye Çık 🌙</button></div></div>
<div class="ov hidden" id="dlg" style="align-items:flex-end;background:rgba(43,26,38,.25)"><div class="card dlgc"><img id="dlgImg"><div class="dt"><b class="who" id="dlgWho">İdiz</b><p id="dlgTxt"></p></div><button class="btn" id="dlgBtn">Devam ▸</button></div></div>
<div class="ov hidden" id="menu"><div class="card" id="menuC"></div></div>
<div class="ov hidden" id="kodeks"><div class="card" id="kodC" style="text-align:left"></div></div>
<div class="ov hidden" id="event" style="background:rgba(20,12,30,.72)"><div class="card evcard" id="evC"></div></div>
<div class="ov hidden" id="dream"><div class="card"><h2>AİLE AGREGUK'TA!</h2><p>Annesi, babası ve kız kardeşi artık Agreguk'ta. Babasıyla kardeşi evin yanındaki tarlada çalışıyor, annesi dükkânda kasaya geçti.</p><p><b>🏆 En büyük başarım açıldı!</b><br>Yemin yerine geldi.</p><button class="btn" id="dreamBtn">Bereket olsun!</button></div></div>
<script>
"use strict";
/* =========================================================
   İDİZ'İN TEZGÂHI — Oro Kıtaları / Agreguk Pazarı
   ========================================================= */
const W=360,H=720,OL='#4a3226';
const WW=1700,WH=2200;
const cv=document.getElementById('c');const cx=cv.getContext('2d');
let DPRMAX=2,g=cx,SC=1,DPR=1,ISC=1,IOX=0,IOY=0,U=1,VW=360,VH=720,BG=null,T=0;
let camX=360,camY=500,camLock=true;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,DPRMAX);
  const iw=innerWidth,ih=innerHeight;
  SC=Math.min(iw/420,ih/640);ISC=Math.min(iw/W,ih/H);IOX=(iw-W*ISC)/2;IOY=(ih-H*ISC)/2;
  U=Math.min(iw/360,1.6);VW=iw/U;VH=ih/U;
  cv.width=Math.round(iw*DPR);cv.height=Math.round(ih*DPR);
  cv.style.width=iw+'px';cv.style.height=ih+'px';BG=null;
}
addEventListener('resize',resize);resize();
